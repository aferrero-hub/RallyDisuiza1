<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Dashboard · Rally Disuiza</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:        #C8202A;
    --red-dark:   #A01820;
    --gold:       #C9A84C;
    --gold-light: #E0BE6A;
    --navy:       #0D1E3A;
    --navy-mid:   #122348;
    --white:      #F5F3EE;
    --muted:      #7A8499;
    --border:     rgba(201,168,76,0.18);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family:'Montserrat',sans-serif;
    background:var(--navy); color:var(--white);
    min-height:100vh;
    padding: 40px;
    position: relative;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(ellipse 80% 60% at 15% 10%,rgba(200,32,42,0.06) 0%,transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 90%,rgba(201,168,76,0.05) 0%,transparent 55%);
  }

  /* HEADER */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }
  .brand-lockup svg { height: 45px; width: auto; }
  
  .live-badge {
    display: flex; align-items: center; gap: 10px;
    background: rgba(91,173,126,0.1); border: 1px solid rgba(91,173,126,0.3);
    padding: 10px 20px; border-radius: 30px;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #5BAD7E;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
  .live-text { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #5BAD7E; text-transform: uppercase; }

  /* TITLE */
  h1 {
    font-family:'Cormorant Garamond',serif;
    font-size: 48px; font-weight: 300; line-height: 1.1;
    color: var(--white); margin-bottom: 30px; text-align: center;
  }
  h1 em { font-style: italic; color: var(--gold-light); }

  /* KPI CARDS */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
    max-width: 900px; margin: 0 auto 40px;
  }
  .kpi-card {
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 16px; padding: 30px; text-align: center;
    backdrop-filter: blur(10px); position: relative; overflow: hidden;
  }
  .kpi-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .kpi-card.red-glow::before { background:linear-gradient(90deg,transparent,var(--red),transparent); }
  
  .kpi-value {
    font-family:'Cormorant Garamond',serif; font-size: 64px; 
    font-weight: 300; color: var(--gold-light); line-height: 1; margin-bottom: 8px;
  }
  .kpi-label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px; 
    color: var(--muted); text-transform: uppercase;
  }

  /* LEADERBOARD */
  .leaderboard-container {
    max-width: 900px; margin: 0 auto;
    background: rgba(13,30,58,0.6); border: 1px solid rgba(200,32,42,0.2);
    border-radius: 16px; padding: 30px;
  }
  .leaderboard-title {
    font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--gold);
    text-transform: uppercase; margin-bottom: 20px; text-align: center;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted);
    text-transform: uppercase; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
    text-align: left;
  }
  th.center { text-align: center; }
  td {
    padding: 18px 15px; border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 15px; color: rgba(245,243,238,0.9);
  }
  td.center { text-align: center; }
  
  /* Rank styling */
  tr:nth-child(1) td { font-weight: 600; color: var(--gold-light); font-size: 18px; }
  tr:nth-child(2) td, tr:nth-child(3) td { font-weight: 500; color: #fff; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.05); font-size: 12px; font-weight: 700; color: var(--muted);
  }
  tr:nth-child(1) .rank-badge { background: rgba(201,168,76,0.15); border: 1px solid var(--gold); color: var(--gold); }
  tr:nth-child(2) .rank-badge { background: rgba(255,255,255,0.1); color: #fff; }
  tr:nth-child(3) .rank-badge { background: rgba(200,32,42,0.15); border: 1px solid var(--red); color: #e8857e; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; font-style: italic; }

  /* LOADER */
  #loader { position: fixed; bottom: 20px; right: 20px; font-size: 10px; color: var(--muted); letter-spacing: 1px; }

</style>
</head>
<body>

  <div class="header">
    <div class="brand-lockup">
      <svg class="disuiza-logo-svg" viewBox="0 0 220 50" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="16" width="38" height="18" fill="#C8202A"/>
        <rect x="10" y="6" width="18" height="38" fill="#C8202A"/>
        <text x="48" y="39" font-family="'Arial Black','Impact',sans-serif" font-size="36" font-weight="900" fill="#C8202A" letter-spacing="-1">DISUIZA</text>
      </svg>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span class="live-text">Live Dashboard</span>
    </div>
  </div>

  <h1>Resultados en <em>Tiempo Real</em></h1>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-value" id="kpi-total">0</div>
      <div class="kpi-label">Participantes</div>
    </div>
    <div class="kpi-card red-glow">
      <div class="kpi-value" id="kpi-avg">0</div>
      <div class="kpi-label">Puntaje Promedio</div>
    </div>
  </div>

  <div class="leaderboard-container">
    <div class="leaderboard-title">Top 10 · Líderes de Cultura</div>
    <table>
      <thead>
        <tr>
          <th width="80" class="center">Rango</th>
          <th>Colaborador</th>
          <th>Área</th>
          <th class="center">Puntaje Total</th>
        </tr>
      </thead>
      <tbody id="board-body">
        <tr><td colspan="4"><div class="empty-state">Esperando a que los participantes completen el rally...</div></td></tr>
      </tbody>
    </table>
  </div>

  <div id="loader">Actualizando...</div>

<script>
// LA MISMA URL QUE USAMOS EN EL JUEGO
const GAS = 'https://script.google.com/macros/s/AKfycbzvpgxigZM37ONNJ-v9jlvqyI0u604vcLE5dVoVfhSzBJJZAVIBL9DKctFXRuvIDKA/exec';

async function fetchData() {
  const loader = document.getElementById('loader');
  loader.style.opacity = '1';

  try {
    const response = await fetch(GAS);
    const data = await response.json();
    
    // Si solo están los encabezados o está vacío
    if (!data || data.length <= 1) {
      loader.style.opacity = '0';
      return;
    }

    // data[0] son los encabezados. Los datos empiezan en data[1]
    // Índices: 1=nombre, 2=area, 3=total
    let validRows = [];
    let totalScores = 0;

    for(let i = 1; i < data.length; i++) {
      let row = data[i];
      if(row[1] && row[3] !== "") { // Si tiene nombre y puntaje
        validRows.push({
          nombre: row[1],
          area: row[2],
          score: parseInt(row[3]) || 0
        });
        totalScores += parseInt(row[3]) || 0;
      }
    }

    // Calcular KPIs
    const participants = validRows.length;
    const avgScore = participants > 0 ? Math.round(totalScores / participants) : 0;

    document.getElementById('kpi-total').textContent = participants;
    
    // Animar el promedio para que no salte de golpe
    let currentAvg = parseInt(document.getElementById('kpi-avg').textContent) || 0;
    document.getElementById('kpi-avg').textContent = avgScore;

    // Ordenar para el Top 10
    validRows.sort((a, b) => b.score - a.score);
    const top10 = validRows.slice(0, 10);

    // Pintar la tabla
    const tbody = document.getElementById('board-body');
    if(top10.length > 0) {
      tbody.innerHTML = '';
      top10.forEach((user, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="center"><div class="rank-badge">${index + 1}</div></td>
          <td>${user.nombre}</td>
          <td style="color:var(--muted); font-size:13px">${user.area}</td>
          <td class="center" style="font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600">${user.score}</td>
        `;
        tbody.appendChild(tr);
      });
    }

  } catch (error) {
    console.error("Error al traer datos:", error);
  } finally {
    setTimeout(() => { loader.style.opacity = '0'; }, 1000);
  }
}

// Traer datos de inmediato y luego cada 15 segundos
fetchData();
setInterval(fetchData, 15000);

</script>
</body>
</html>
